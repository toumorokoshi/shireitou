name: shireitou
description: "Cross-platform agents view for Agent Host Protocol hosts."
publish_to: 'none'
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  ahp_client:
    path: ../packages/ahp_client
  async: ^2.13.1
  dartssh2: ^4.1.0
  diffutil_dart: ^5.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  logging: ^1.3.0
  markdown: ^7.3.1
  re_highlight: ^0.0.3
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.3
  super_sliver_list: ^0.4.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.1
  window_manager: ^0.5.2
  xterm: ^4.0.0

dev_dependencies:
  ahp_fake_host:
    path: ../packages/ahp_fake_host
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  integration_test:
    sdk: flutter
  json_rpc_2: ^4.1.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0

flutter:
  uses-material-design: true

# App icons, generated from assets/icon/shireitou.svg by scripts/render-icon
# (see docs/packaging.md).
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#283593"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  adaptive_icon_monochrome: assets/icon/icon-foreground.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#283593"
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#283593"
    theme_color: "#3F51B5"
  windows:
    generate: true
    image_path: assets/icon/icon-rounded.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon-rounded.png

# Windows .msix (scripts/package-windows signs it when the secrets are set).
msix_config:
  display_name: shireitou
  publisher_display_name: shireitou developers
  publisher: CN=shireitou
  identity_name: dev.shireitou.shireitou
  logo_path: assets/icon/icon-rounded.png
  capabilities: internetClient,internetClientServer,privateNetworkClientServer
  languages: en-us
